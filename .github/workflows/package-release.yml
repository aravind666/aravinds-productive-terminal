name: package-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload packages for (e.g. v1.0.0 or aravinds-productive-terminal-v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -o /tmp/nfpm.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Determine version
        run: |
          # Strip any leading component-name prefix, keeping just the semver, e.g.
          # "aravinds-productive-terminal-v1.0.0" -> "1.0.0"
          VERSION=$(echo "${{ inputs.tag }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build .deb and .rpm packages
        run: |
          mkdir -p dist
          nfpm pkg --config nfpm.yaml --packager deb --target dist/
          nfpm pkg --config nfpm.yaml --packager rpm --target dist/

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.deb dist/*.rpm --clobber
